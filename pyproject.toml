[project]
name = "community-agent"
version = "0.1.0"
description = "Community post agent: one brief -> platform-native posts for Telegram / X / Reddit / LinkedIn"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "rich>=13.7",
]

[project.scripts]
community = "community_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/community_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
